# The shared mesanim.shocked plays the happy heads; Varrock needs the real chatshock ones.
[[mesanim]]
id = "mesanim.shock"
len1 = "seq.chatshock1"
len2 = "seq.chatshock2"
len3 = "seq.chatshock3"
len4 = "seq.chatshock4"

# Romily Weaklax pie errand: pie type index (0 = none) and pies still owed.
[[varp]]
id = "varp.varrock_romily_pies"
scope = "Perm"
transmit = "Never"

[[varbit]]
id = "varbit.varrock_romily_pie_type"
varp = "varp.varrock_romily_pies"
startBit = 0
endBit = 3

[[varbit]]
id = "varbit.varrock_romily_pie_count"
varp = "varp.varrock_romily_pies"
startBit = 4
endBit = 8

